<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Japan 2027</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fafaf8;--ink:#1f2328;--mute:#6e7378;--line:#e3e3df;--acc:#c8372d;--chip:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--ink:#ececea;--mute:#9a9ea3;--line:#2e3033;--acc:#ff6b5e;--chip:#1f2023}}
:root[data-theme="dark"]{--bg:#17181a;--ink:#ececea;--mute:#9a9ea3;--line:#2e3033;--acc:#ff6b5e;--chip:#1f2023}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
header{max-width:620px;margin:0 auto;padding:28px 18px 8px}
header h1{margin:0;font-size:1.7rem;font-weight:700;letter-spacing:-.02em}
header p{margin:2px 0 0;color:var(--mute);font-size:.9rem}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{max-width:620px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 18px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;font:inherit;font-size:.82rem;font-weight:600;color:var(--mute);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:620px;margin:0 auto;padding:22px 18px 48px}
h2{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:.88rem;margin:2px 0 14px}
.stay{font-size:.85rem;padding:9px 12px;border-left:3px solid var(--acc);background:var(--chip);margin-bottom:6px}
.act{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.t{font-size:.8rem;color:var(--mute);font-variant-numeric:tabular-nums;padding-top:2px}
.n{font-weight:600}
.pri{color:var(--acc);font-size:.75rem;font-weight:600;margin-left:6px}
.d{font-size:.88rem;color:var(--mute)}
.loc{display:inline-block;margin:3px 14px 0 0;font-size:.8rem;color:var(--acc);text-decoration:none}
.loc:hover{text-decoration:underline}
footer{max-width:620px;margin:0 auto;padding:0 18px 28px;color:var(--mute);font-size:.78rem}
</style></head><body>

["Jan 30","Nerd day","Tokyo","Max character shopping day",[

const tabs=document.getElementById("tabs"),m=document.getElementById("m");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function show(i){
 const d=D[i];
 [...tabs.children].forEach((b,j)=>b.setAttribute("aria-selected",j===i));
 const acts=d[4].map(a=>{
  const [t,n,note,q]=a.split("|"),star=n.includes("*");
  const links=q.split(";").map(x=>`<a class="loc" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x)}" target="_blank" rel="noopener">${esc(x)}</a>`).join("");
  return `<div class="act"><div class="t">${esc(t)}</div><div><div class="n">${esc(n.replace(" *","").replace("*",""))}${star?'<span class="pri">Priority</span>':""}</div><div class="d">${esc(note)}</div>${links}</div></div>`}).join("");
 m.innerHTML=`<h2>${d[0]}: ${esc(d[1])}</h2><div class="sub">${esc(d[2])}</div>${d[3]?`<div class="stay">${esc(d[3])}</div>`:""}${acts}`;
 window.scrollTo({top:0});
 try{localStorage.setItem("jp-day",i)}catch(e){}
}
D.forEach((d,i)=>{const b=document.createElement("button");b.textContent=d[0];b.setAttribute("role","tab");b.onclick=()=>show(i);tabs.appendChild(b)});
let s=0;try{s=+localStorage.getItem("jp-day")||0}catch(e){}
show(s<D.length?s:0);

</script></body></html>
